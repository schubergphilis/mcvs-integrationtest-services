---
name: Golang
"on":
  # required by gomod-go-version-updater to trigger this action once pr has
  # been reviewed
  pull_request_review:
    types: [submitted]
  push:
permissions:
  contents: read
  packages: read
jobs:
  mcvs-golang-action:
    strategy:
      matrix:
        testing-type:
          - component
          - coverage
          - integration
          - lint
          - security-golang-modules
          - security-grype
          - security-trivy
          - unit
    runs-on: ubuntu-22.04
    env:
      TASK_X_REMOTE_TASKFILES: 1
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      # yamllint disable-line rule:line-length
      - uses: schubergphilis/mcvs-golang-action@b46f3d5f1ebb64d5d308a86aff0afa4f63174746 # v3.7.21
        with:
          code-coverage-expected: 83.5
          golang-unit-tests-exclusions: |-
            \(cmd\/mcvs-integrationtest-services\|cmd\/oktamock\)
          testing-type: ${{ matrix.testing-type }}
          token: ${{ secrets.GITHUB_TOKEN }}
