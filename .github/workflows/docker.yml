---
name: Docker
"on":
  # required by gomod-go-version-updater to trigger this action once pr has
  # been reviewed
  pull_request_review:
    types: [submitted]
  push:
  # dispatched by release.yml on the tags that auto-release creates
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  mcvs-docker-action:
    strategy:
      matrix:
        build-args:
          - mcvs-integrationtest-services
          - mcvs-stub-server
          - oktamock
    runs-on: ubuntu-22.04
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # yamllint disable-line rule:line-length
      - uses: schubergphilis/mcvs-docker-action@c9dfc78bd277dcabbe8719db6e1fc58b2eb673e1 # v0.14.0
        with:
          build-args: ${{ matrix.build-args }}
          # yamllint disable rule:line-length
          dockle-accept-key: APPLICATION,curl,HOME,libcrypto3,libssl3,PATH
          # yamllint enable rule:line-length
          images: ghcr.io/${{ github.repository }}/${{ matrix.build-args }}
          platforms: linux/amd64
          token: ${{ secrets.GITHUB_TOKEN }}
