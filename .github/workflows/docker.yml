---
name: Docker
"on":
  # required by gomod-go-version-updater to trigger this action once pr has
  # been reviewed
  pull_request_review:
    types: [submitted]
  push:
permissions:
  contents: read
  packages: write
jobs:
  mcvs-docker-action:
    strategy:
      matrix:
        build-args:
          - mcvs-integrationtest-services
          - mcvs-stub-server
          - oktamock
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      # yamllint disable-line rule:line-length
      - uses: schubergphilis/mcvs-docker-action@ed30e5db799a279ec1062bc3ff237462c7ae797e # v0.12.0
        with:
          build-args: ${{ matrix.build-args }}
          # yamllint disable rule:line-length
          dockle-accept-key: APPLICATION,curl,HOME,libcrypto3,libssl3,PATH
          # yamllint enable rule:line-length
          images: ghcr.io/${{ github.repository }}/${{ matrix.build-args }}
          token: ${{ secrets.GITHUB_TOKEN }}
