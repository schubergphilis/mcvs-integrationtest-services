---
name: Docker
"on":
  # required by gomod-go-version-updater to trigger this action once pr has
  # been reviewed
  pull_request_review:
    types: [submitted]
  push:
permissions:
  contents: read
  packages: write
jobs:
  mcvs-docker-action:
    strategy:
      matrix:
        build-args:
          - mcvs-integrationtest-services
          - mcvs-stub-server
          - oktamock
    runs-on: ubuntu-22.04
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # yamllint disable-line rule:line-length
      - uses: schubergphilis/mcvs-docker-action@e0d519535bd0bc2380e69ad0e1ce0bfa063c3e7f # v0.13.2
        with:
          build-args: ${{ matrix.build-args }}
          # yamllint disable rule:line-length
          dockle-accept-key: APPLICATION,curl,HOME,libcrypto3,libssl3,PATH
          # yamllint enable rule:line-length
          images: ghcr.io/${{ github.repository }}/${{ matrix.build-args }}
          platforms: linux/amd64
          token: ${{ secrets.GITHUB_TOKEN }}
